<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>查看文件 · Serene Walker</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <style>
    .back {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      margin-bottom: 1.75rem;
      color: var(--muted);
      font-size: .9rem;
    }
    .back:hover { color: var(--accent); text-decoration: none; }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      letter-spacing: -.01em;
      word-break: break-all;
    }

    .meta {
      margin: .4rem 0 0;
      color: var(--muted);
      font-size: .85rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin: 1.1rem 0 1.2rem;
    }

    pre.code {
      margin: 0;
      padding: 1rem 1.1rem;
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font-size: .8rem;
      line-height: 1.75;
      counter-reset: line;
    }
    pre.code code {
      display: block;
      min-width: max-content;
      font-family: ui-monospace, SFMono-Regular, "Maple Mono CN", Menlo, Consolas, monospace;
    }
    .line { display: block; white-space: pre; }
    .line::before {
      content: counter(line);
      counter-increment: line;
      display: inline-block;
      width: 2.2em;
      margin-right: 1.1em;
      padding-right: .6em;
      border-right: 1px solid var(--border);
      color: var(--muted);
      opacity: .55;
      text-align: right;
      user-select: none;
    }
    .error { color: var(--muted); }

    @media (max-width: 560px) {
      pre.code { font-size: .74rem; }
    }
  </style>
  <script src="site.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="./">Serene Walker</a>
      <button class="theme-toggle" id="theme-toggle" type="button"
              aria-label="切换深色/浅色模式" title="切换深色/浅色模式">◐</button>
    </header>

    <main>
      <a class="back" id="back" href="./">← 返回</a>

      <h1 id="filename">正在读取…</h1>
      <p class="meta" id="meta">文件来自项目页，下面显示的是原始内容。</p>

      <div class="toolbar" id="toolbar" hidden>
        <a class="btn primary" id="download" href="#" download>下载</a>
        <button class="btn" id="copy" type="button">复制内容</button>
      </div>

      <pre class="code"><code id="code">正在读取文件…</code></pre>

      <noscript>
        <p class="meta">这个页面需要 JavaScript 才能显示源码，可以直接到
          <a href="projects/arctic-ink/">项目页</a> 下载文件。</p>
      </noscript>
    </main>

    <footer>
      <a href="./">← 返回首页</a>
      <span>© <span id="year">2026</span> Serene Walker</span>
    </footer>
  </div>

  <script>
    (function () {
      // 允许查看的项目：新增项目时在这里补一条
      var PROJECTS = {
        'arctic-ink': { title: 'Arctic Ink', path: 'projects/arctic-ink/' }
      };

      var codeEl = document.getElementById('code');
      var nameEl = document.getElementById('filename');
      var metaEl = document.getElementById('meta');
      var toolbar = document.getElementById('toolbar');
      var downloadEl = document.getElementById('download');
      var copyEl = document.getElementById('copy');
      var backEl = document.getElementById('back');

      function formatSize(bytes) {
        if (!bytes) return '';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(bytes < 10240 ? 1 : 0) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
      }

      function fail(message) {
        nameEl.textContent = '打不开这个文件';
        metaEl.textContent = message;
        codeEl.textContent = '';
        toolbar.hidden = true;
      }

      var params = new URLSearchParams(location.search);
      var key = params.get('p') || '';
      var file = params.get('f') || 'install.sh';
      var project = PROJECTS[key];

      if (!project) return fail('项目参数不对，请从项目页进入。');
      if (!/^[A-Za-z0-9][A-Za-z0-9._\/-]*$/.test(file) || file.indexOf('..') !== -1) {
        return fail('文件参数不对，请从项目页进入。');
      }

      var url = project.path + 'files/' + file;

      nameEl.textContent = file;
      document.title = file + ' · ' + project.title;
      metaEl.textContent = '来自 ' + project.title + ' 的原始文件。';
      backEl.href = project.path;
      backEl.textContent = '← ' + project.title;
      downloadEl.href = url;
      toolbar.hidden = false;

      fetch(url, { cache: 'no-cache' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var size = formatSize(Number(res.headers.get('content-length')));
          if (size) metaEl.textContent = '来自 ' + project.title + ' · ' + size;
          return res.text();
        })
        .then(function (text) {
          var lines = text.replace(/\n$/, '').split('\n');
          var frag = document.createDocumentFragment();
          lines.forEach(function (line) {
            var span = document.createElement('span');
            span.className = 'line';
            span.textContent = line;
            frag.appendChild(span);
          });
          codeEl.textContent = '';
          codeEl.appendChild(frag);

          copyEl.addEventListener('click', function () {
            if (!navigator.clipboard) {
              copyEl.textContent = '浏览器不支持复制';
              return;
            }
            navigator.clipboard.writeText(text).then(function () {
              copyEl.textContent = '已复制';
              setTimeout(function () { copyEl.textContent = '复制内容'; }, 1600);
            }).catch(function () {
              copyEl.textContent = '复制失败';
            });
          });
        })
        .catch(function (err) {
          fail('读取失败（' + err.message + '）。');
        });
    })();
  </script>
</body>
</html>
