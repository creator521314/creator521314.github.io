{{ define "main" }}
<a class="back" href="{{ "/notes/" | relURL }}">← 全部文章</a>
<article class="note">
  <h1>{{ .Title }}</h1>
  <p class="note-meta">
    <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006 年 1 月 2 日" }}</time>
  </p>
  {{ .Content }}
</article>
{{ end }}
